<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dessert Store - Forgot Password</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
<style>/* styles.css (works for Login, Sign-Up, and Forgot Password pages) */

/* Global styles */
body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Authentication container */
.auth-container {
    width: 100%;
    max-width: 400px;
    margin: auto;
    text-align: center;
    padding: 20px;
}

/* Card-style form container */
.auth-card {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.auth-card h2 {
    margin-bottom: 20px;
    color: #333333;
}

/* Form styling */
.form-group {
    margin-bottom: 20px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 5px;
    color: #555555;
}

input[type="email"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #cccccc;
    border-radius: 4px;
    font-size: 16px;
}

/* Button styles */
.auth-btn {
    width: 100%;
    padding: 10px;
    background-color: #ff9800;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

.auth-btn:hover {
    background-color: #e68900;
}

/* Links */
.auth-links {
    margin-top: 15px;
}

.auth-links a {
    color: #007bff;
    text-decoration: none;
    font-size: 14px;
}

.auth-links a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Reset Your Password</h2>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" required>
                </div>
                <button type="submit" class="auth-btn">Send Reset Link</button>
                <div class="auth-links">
                    <a href="surilogin.html">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            
            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    alert('Password reset email sent. Please check your inbox.');
                    window.location.href = "surilogin.html";
                })
                .catch(error => {
                    alert(getAuthErrorMessage(error.code));
                });
        });

        function getAuthErrorMessage(errorCode) {
            switch(errorCode) {
                case 'auth/user-not-found':
                    return 'No account found with this email.';
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                default:
                    return 'Failed to send reset email. Please try again.';
            }
        }
    </script>
</body>
</html>
