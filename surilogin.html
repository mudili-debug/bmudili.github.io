<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dessert Store - Login</title>
    <style>
        /* Your existing styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #ff758c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .auth-btn:hover {
            background: #e8495f;
        }
        
        .auth-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        
        .text-link {
            color: #ff758c;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        
        .text-link:hover {
            text-decoration: underline;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        
        .close-modal {
            float: right;
            cursor: pointer;
            font-size: 20px;
        }
        
        #resetEmail {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="auth-btn">Login</button>
                <div class="auth-links">
                    <a href="signup.html" class="text-link">Create account</a>
                    <a id="forgotPasswordLink" class="text-link">Forgot password?</a>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <input type="email" id="resetEmail" placeholder="Your email address">
            <button id="sendResetLink" class="auth-btn">Send Reset Link</button>
            <p id="resetMessage" style="margin-top: 15px; display: none;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAtiqeg_UMXmOMLgYnBfv530_N-n-nwbj8",
            authDomain: "dessertstore-833ea.firebaseapp.com",
            projectId: "dessertstore-833ea",
            storageBucket: "dessertstore-833ea.firebasestorage.app",
            messagingSenderId: "108572510478",
            appId: "1:108572510478:web:e9b3439de30bdd86136f5f",
            measurementId: "G-6BHD0FE9ML",
            databaseURL: "https://dessertstore-833ea-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check auth state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "homeindex.html";
            }
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = e.target.querySelector('button[type="submit"]');
            
            loginBtn.disabled = true;
            loginBtn.textContent = "Signing in...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "homeindex.html";
            } catch (error) {
                alert(getAuthErrorMessage(error.code));
                console.error("Login error:", error);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "Login";
            }
        });

        // Forgot password modal handling
        const modal = document.getElementById('forgotPasswordModal');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const closeModal = document.querySelector('.close-modal');
        const sendResetBtn = document.getElementById('sendResetLink');
        const resetMessage = document.getElementById('resetMessage');

        forgotPasswordLink.addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            if (email) {
                document.getElementById('resetEmail').value = email;
            }
            modal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
            resetMessage.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                resetMessage.style.display = 'none';
            }
        });

        // Send password reset email
        sendResetBtn.addEventListener('click', async () => {
            const email = document.getElementById('resetEmail').value;
            
            if (!email) {
                alert("Please enter your email address");
                return;
            }

            sendResetBtn.disabled = true;
            sendResetBtn.textContent = "Sending...";

            try {
                await sendPasswordResetEmail(auth, email);
                resetMessage.textContent = "Password reset email sent! Check your inbox.";
                resetMessage.style.display = "block";
                resetMessage.style.color = "green";
            } catch (error) {
                resetMessage.textContent = getAuthErrorMessage(error.code);
                resetMessage.style.display = "block";
                resetMessage.style.color = "red";
                console.error("Password reset error:", error);
            } finally {
                sendResetBtn.disabled = false;
                sendResetBtn.textContent = "Send Reset Link";
            }
        });

        function getAuthErrorMessage(errorCode) {
            switch(errorCode) {
                case 'auth/invalid-email': return 'Invalid email format';
                case 'auth/user-not-found': return 'No account found with this email';
                case 'auth/missing-email': return 'Please enter your email';
                case 'auth/too-many-requests': return 'Too many attempts. Try again later';
                default: return 'Error occurred. Please try again';
            }
        }
    </script>
</body>
</html>
