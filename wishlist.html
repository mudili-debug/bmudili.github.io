<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #ff6f61;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        nav {
            text-align: center;
            margin-top: 10px;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffd700;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        .product-card img {
            max-width: 100%;
            border-radius: 10px;
            height: 180px;
            object-fit: cover;
        }
        .product-card p {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }
        .product-card button {
            background: #ff6f61;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .product-card button:hover {
            background: #e55b50;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Wishlist</h1>
        <nav>
            <a href="homeindex.html">Home</a>
            <a href="flavors.html">Flavors</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>
    <main>
        <div id="wishlist-container" class="product-grid"></div>
    </main>
   <script>
    document.addEventListener("DOMContentLoaded", function () {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function renderWishlist() {
            const wishlistContainer = document.getElementById("wishlist-container");
            wishlistContainer.innerHTML = "";

            if (wishlist.length === 0) {
                wishlistContainer.innerHTML = "<p style='text-align:center; font-size:20px;'>Your wishlist is empty.</p>";
                return;
            }

            wishlist.forEach((item, index) => {
                const productCard = document.createElement("div");
                productCard.classList.add("product-card");
                productCard.innerHTML = 
                    <img src="${item.img}" alt="${item.name}">
                    <p>${item.name}</p>
                    <p>$${item.price.toFixed(2)}</p>
                    <button class="remove" data-index="${index}">Remove</button>
                    <button class="add-to-cart" data-name="${item.name}">Add to Cart</button>
                ;
                wishlistContainer.appendChild(productCard);
            });
        }

        function removeFromWishlist(index) {
            wishlist.splice(index, 1);
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            renderWishlist();
        }

        function addToCart(name) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const product = wishlist.find(item => item.name === name);

            if (!cart.some(item => item.name === name)) {
                cart.push(product);
                localStorage.setItem("cart", JSON.stringify(cart));
                alert("Added to Cart!");
            } else {
                alert("Already in Cart!");
            }
        }

        // Event listeners for Remove and Add to Cart buttons
        document.getElementById("wishlist-container").addEventListener("click", function (e) {
            if (e.target.classList.contains("remove")) {
                const index = e.target.dataset.index;
                removeFromWishlist(index);
            }

            if (e.target.classList.contains("add-to-cart")) {
                const name = e.target.dataset.name;
                addToCart(name);
            }
        });

        // Render wishlist on page load
        renderWishlist();
    });
</script>
</body>
</html>
