<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .confirmation {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #28a745;
            font-size: 24px;
        }
        p {
            color: #333;
            font-size: 16px;
        }
        .order-id {
            font-weight: bold;
            color: #007bff;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s ease;
        }
        a:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="confirmation">
        <h2>Order Confirmed! 🎉</h2>
        <p>Your order #<span id="order-id" class="order-id"></span> has been placed successfully.</p>
        <p>We've sent a confirmation to your email.</p>
        <a href="homeindex.html">Continue Shopping</a>
    </div>

    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        
        if (orderId) {
            document.getElementById('order-id').textContent = orderId;
        }
    </script>
</body>
</html>
